<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Idóneo Abogados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182644; --ink-2:#233258; --brass:#b98a2e; --brass-light:#d9ab52;
    --parchment:#f1ead8; --parchment-dim:#e4dbc4;
    --line: rgba(241,234,216,0.18); --line-strong: rgba(241,234,216,0.32);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--parchment); font-family:'IBM Plex Sans', sans-serif; line-height:1.5;}
  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 28px;}

  header{position:sticky; top:0; z-index:50; background:rgba(24,38,68,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .header-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:900px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Newsreader', serif; font-size:1.3rem; font-weight:600; text-decoration:none;}
  .brand-mark{width:24px; height:24px; flex-shrink:0;}
  .nav-right{display:flex; align-items:center; gap:14px; position:relative;}
  .nav-links{display:flex; align-items:center; gap:10px;}
  .nav-toggle{display:none;}
  .nav-link{font-family:'IBM Plex Mono', monospace; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.07em; padding:9px 16px; border-radius:2px; text-decoration:none; color:rgba(241,234,216,0.8);}
  .nav-link.primary{border:1px solid var(--brass-light); color:var(--parchment);}

  .back-link{display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--brass-light); text-decoration:none; margin:32px 0 20px;}

  .profile-card{background:var(--parchment); color:var(--ink); border-radius:6px; padding:36px; margin-bottom:28px;}
  .profile-top{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;}
  .avatar-lg{width:72px; height:72px; border-radius:50%; background:var(--ink); color:var(--brass-light); display:flex; align-items:center; justify-content:center; font-family:'Newsreader', serif; font-weight:600; font-size:1.7rem; flex-shrink:0;}
  .profile-name{font-family:'Newsreader', serif; font-size:1.7rem; font-weight:600;}
  .profile-city{color:#6b6250; margin-top:4px;}
  .verified-tag{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:#5c7a4f; margin-top:8px;}
  .verified-tag svg{width:13px; height:13px;}
  .profile-meta-row{display:flex; align-items:center; gap:18px; margin-top:18px; flex-wrap:wrap;}
  .stars{color:var(--brass); font-size:1rem;}
  .rating-count{color:#8a8069; font-size:0.82rem; margin-left:4px;}
  .price-tag{font-family:'IBM Plex Mono', monospace; font-size:0.88rem; color:var(--ink-2);}
  .specialty-chip{font-family:'IBM Plex Mono', monospace; font-size:0.76rem; padding:5px 12px; border:1px solid #c9bd9c; border-radius:20px; color:var(--ink-2);}
  .profile-bio{margin-top:24px; padding-top:24px; border-top:1px solid #ddd2b0; font-size:0.96rem; color:#3a3222; max-width:60ch;}
  .profile-exp{font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:#6b6250; margin-top:10px;}
  .contact-btn-lg{
    display:inline-flex; align-items:center; gap:8px; margin-top:24px; background:#1f8a45; color:#fff; text-decoration:none;
    padding:13px 22px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.06em;
  }
  .contact-btn-lg svg{width:16px; height:16px;}

  .reviews-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .reviews-head h2{font-family:'Newsreader', serif; font-size:1.2rem; font-weight:500;}
  .review-card{background:rgba(241,234,216,0.06); border:1px solid var(--line); border-radius:4px; padding:18px 20px; margin-bottom:12px;}
  .review-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .review-author{font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:rgba(241,234,216,0.85);}
  .review-text{font-size:0.92rem; color:rgba(241,234,216,0.72);}

  .demo-note{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:#8a6a1f;
    background:#f3e4c2; border:1px solid #d9ab52; padding:6px 12px; border-radius:20px; display:inline-block; margin-bottom:20px;
  }

  .not-found{padding:80px 0; text-align:center; color:rgba(241,234,216,0.7);}

  footer{padding:36px 0; border-top:1px solid var(--line); margin-top:40px;}
  .footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; max-width:900px; margin:0 auto; padding:0 28px;}
  footer .mono{font-size:0.72rem; color:rgba(241,234,216,0.5); font-family:'IBM Plex Mono', monospace;}

  @media (max-width: 600px){
    .profile-card{padding:24px;}
  }
  @media (max-width: 680px){
    .nav-toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--line-strong); border-radius:6px; background:none; color:var(--parchment); cursor:pointer; order:2;}
    .nav-toggle:hover{border-color:var(--brass-light);}
    .auth-slot{order:1;}
    .nav-links{
      display:none; position:absolute; top:calc(100% + 12px); right:0; min-width:230px; max-width:calc(100vw - 40px); z-index:55;
      flex-direction:column; align-items:stretch; gap:4px; background:var(--ink-2); border:1px solid var(--line-strong);
      border-radius:6px; padding:10px; box-shadow:0 16px 36px rgba(0,0,0,0.35);
    }
    .nav-links.open{display:flex;}
    .nav-links .nav-link{width:100%; text-align:center; padding:12px 10px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M5 7l-3 6a4 4 0 0 0 8 0l-3-6m14 0l-3 6a4 4 0 0 0 8 0l-3-6M4 7h6m4 0h6M8 21h8"/></svg>
      Idóneo <span style="opacity:0.55; font-weight:400; margin-left:6px;">Abogados</span>
    </a>
    <div class="nav-right">
      <div class="nav-links" id="navLinks">
        <a class="nav-link" href="index.html">Buscar abogado</a>
        <a class="nav-link primary" href="registro.html">Regístrate como abogado</a>
      </div>
      <div class="auth-slot" id="navAuth"></div>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir menú" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <a href="index.html" class="back-link">← Volver a resultados</a>
  <div id="profileContent"></div>
</div>

<footer>
  <div class="footer-inner">
    <span class="mono">© 2026 IDÓNEO — DIRECTORIO LEGAL, MÉXICO</span>
    <span class="mono">AVISO DE PRIVACIDAD · TÉRMINOS</span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="listings.js"></script>
<script>
  function initials(name){
    return name.replace(/^Lic\.\s*/,'').split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }
  function starString(rating){
    const full = Math.round(rating);
    return '★★★★★'.slice(0,full) + '☆☆☆☆☆'.slice(0, 5-full);
  }

  const content = document.getElementById('profileContent');
  content.innerHTML = '<p class="not-found">Cargando perfil…</p>';

  async function init(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    let abogados;
    try{
      abogados = await window.IdoneoListings.getAllListings();
    } catch(err){
      console.error('No se pudieron cargar los perfiles registrados, mostrando solo los de ejemplo.', err);
      abogados = (window.IdoneoListings && window.IdoneoListings.DEMO_ABOGADOS) || [];
    }
    const ab = abogados.find(a => String(a.id) === id);
    renderProfile(ab);
  }

  function renderProfile(ab){
  if(!ab){
    content.innerHTML = `<div class="not-found"><p>No encontramos ese perfil.</p></div>`;
  } else {
    const reviewsHtml = ab.reseñas.map(r => `
      <div class="review-card">
        <div class="review-top">
          <span class="review-author">${r.autor}</span>
          <span class="stars">${starString(r.estrellas)}</span>
        </div>
        <div class="review-text">${r.texto}</div>
      </div>
    `).join('');

    content.innerHTML = `
      ${window.IdoneoListings.isDemo(ab.id) ? '<span class="demo-note">⚠ Perfil de ejemplo</span>' : ''}
      <div class="profile-card">
        <div class="profile-top">
          <div class="avatar-lg">${initials(ab.nombre)}</div>
          <div>
            <div class="profile-name">${ab.nombre}</div>
            <div class="profile-city">${ab.ciudad}</div>
            ${ab.verificado ? `<div class="verified-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>Cédula verificada</div>` : ''}
          </div>
        </div>
        <div class="profile-meta-row">
          <span class="specialty-chip">${ab.especialidad}</span>
          <span><span class="stars">${starString(ab.rating)}</span><span class="rating-count">(${ab.reviews} reseñas)</span></span>
          <span class="price-tag">${ab.precio}</span>
        </div>
        <div class="profile-bio">${ab.bio}</div>
        <div class="profile-exp">Experiencia: ${ab.experiencia}</div>
        <a class="contact-btn-lg" href="https://wa.me/${ab.telefono}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.3A10 10 0 1 0 12 2zm0 18.1a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.1 8.1 0 1 1 12 20.1zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.7.9-.3.2-.5.1a6.6 6.6 0 0 1-1.9-1.2A7.2 7.2 0 0 1 10 11.3c-.1-.2 0-.3.1-.4l.4-.4a1.7 1.7 0 0 0 .3-.5.5.5 0 0 0 0-.5c-.1-.1-.5-1.3-.7-1.8s-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.8 2.8 0 0 0-.9 2.1c0 1.2.9 2.4 1 2.6s1.7 2.7 4.2 3.7a5 5 0 0 0 3 .6 2.5 2.5 0 0 0 1.7-1.2 2 2 0 0 0 .1-1.2c-.1-.1-.2-.2-.5-.3z"/></svg>
          Contactar por WhatsApp
        </a>
      </div>
      <div class="reviews-head"><h2>Reseñas (${ab.reviews})</h2></div>
      ${reviewsHtml}
    `;
  }
  }

  init();
</script>

<script src="auth.js" defer></script>

</body>
</html>
